<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Panel de Gestión de Usuarios</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h4>Agregar Usuario</h4>
                <form id="formularioUsuario">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan" required>
                    </div>
                    <div class="mb-3">
                        <label for="edad" class="form-label">Edad:</label>
                        <input type="number" id="edad" class="form-control" placeholder="Ej. 30" required>
                    </div>
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol:</label>
                        <select id="rol" class="form-select" required>
                            <option value="">Seleccione un rol...</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Usuario">Usuario</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Agregar Usuario</button>
                </form>
            </div>
            
            <div class="card p-3 mt-3 shadow-sm">
                <h5>Estadísticas</h5>
                <p class="mb-1">Activos: <span id="contadorActivos" class="badge bg-success">0</span></p>
                <p class="mb-0">Inactivos: <span id="contadorInactivos" class="badge bg-danger">0</span></p>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Lista de Usuarios</h4>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm" onclick="ordenarPorEdad()">Ordenar por Edad</button>
                        <select id="filtroRol" class="form-select form-select-sm w-auto" onchange="filtrarUsuarios()">
                            <option value="Todos">Todos</option>
                            <option value="Administrador">Solo Administradores</option>
                            <option value="Usuario">Solo Usuarios</option>
                        </select>
                    </div>
                </div>

                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
